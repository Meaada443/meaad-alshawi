<style>
:root{--navy:#545454;--bg:#737373;--card:#ececec;--text:#2b2d2f;--muted:#6f7377;--line:#bdbdbd;--run:#55595e;--late:#b3473f;--plan:#b7862b;--done:#4e8a5f}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--text)}
input,select,textarea,button{font-family:inherit;font-size:15px}
input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;margin:4px 0 10px;background:#f7f7f7}
:focus-visible{outline:3px solid #9ca3af;outline-offset:2px}
.wrap{max-width:1200px;margin:auto;padding:20px}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header h1{margin:0;font-size:19px}.hb{display:flex;gap:8px;align-items:center}.rl{font-size:13px;opacity:.85}
.sm{background:#ffffff26;color:#fff;border:0;padding:6px 14px;border-radius:8px;cursor:pointer}
.sm.del{background:#fee2e2;color:var(--late);margin-top:6px}
.btn{background:var(--run);color:#fff;border:0;padding:11px 22px;border-radius:10px;cursor:pointer;font-weight:700;margin:4px 0}
.btn:disabled{opacity:.6;cursor:wait}.btn.alt{background:#8a8d90}.btn.danger{background:var(--late)}
.back{background:none;border:0;color:var(--run);font-weight:700;cursor:pointer;padding:0 0 12px}
.s-run{--c:var(--run)}.s-plan{--c:var(--plan)}.s-done{--c:var(--done)}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}.top h2{margin:0;font-size:22px}
/* الأعمدة الثلاثة */
.cols{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.col{background:#e9eef5;border-radius:18px;padding:12px;border-top:6px solid var(--c)}
.col h3{margin:4px 4px 12px;display:flex;justify-content:space-between;align-items:center;font-size:18px}
.col h3 b{background:var(--c);color:#fff;border-radius:20px;padding:0 12px;font-size:15px}
.card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #54545414;cursor:pointer;margin-bottom:12px}
.img{height:170px;background:linear-gradient(135deg,#e2e2e2,#bcbcbc) center/cover;position:relative}
.cw{position:absolute;top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:700;color:#fff}
.chip.ty{background:#334155}
.wa{background:#25d366;color:#fff;border-radius:10px;padding:11px 18px;text-decoration:none;font-weight:700;font-size:15px}
.chip.ok{background:var(--done)}.chip.late{background:var(--late)}
.body{padding:14px}.body h4{margin:0 0 2px;font-size:19px}.body p{margin:0;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:8px;margin:12px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.row{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
/* صفحة المشروع */
.banner{height:280px;border-radius:18px;background:linear-gradient(135deg,#e2e2e2,#bcbcbc) center/cover;position:relative}
.box{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 14px #54545410}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:14px 0}
.det span{display:block;font-size:13px;color:var(--muted)}.det b{font-size:17px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:18px 0}
.tab{white-space:nowrap;background:var(--card);border:1px solid var(--line);padding:9px 18px;border-radius:24px;cursor:pointer;font-weight:500}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lbl{font-size:13px;color:var(--muted)}
.item{border-bottom:1px solid var(--line);padding:12px 0}.item small{color:var(--muted);display:block;margin-top:6px}
.item img,.item video{width:100%;max-height:420px;object-fit:cover;border-radius:12px;margin-top:8px}
.item img{cursor:zoom-in}
.vis{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}.vis input{width:auto;margin:0}.srow{display:flex;gap:8px;align-items:center;margin:6px 0}.srow input[type=checkbox]{width:auto;margin:0}.srow input[type=text]{flex:1;margin:0}.stf label{display:flex;gap:8px;align-items:center;margin:6px 0}.stf input{width:auto;margin:0}.vtag{display:inline-block;margin-top:8px;font-size:13px;padding:2px 10px;border-radius:20px;background:#eee;color:var(--muted)}.vtag.on{background:#e3f1e4;color:#2e7d32}
.lb{position:fixed;inset:0;background:#000d;z-index:99;display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lbx{position:absolute;top:14px;left:14px;background:#ffffff33;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer}
.note,.empty{text-align:center;color:var(--muted);padding:22px}
.login{max-width:380px;margin:50px auto}.msg{color:var(--late);font-size:14px;min-height:20px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .box{width:100%;max-width:440px;max-height:92vh;overflow:auto}
.link{white-space:pre-wrap;background:#f0f0f0;padding:10px;border-radius:10px;word-break:break-all;font-size:13px;direction:ltr;text-align:left}
@media(min-width:900px){.cols{grid-template-columns:repeat(3,1fr)}}
/* ===== الخلفية والشعار ===== */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:url(bg.jpg) center bottom/cover no-repeat;pointer-events:none}
.col{background:#0000002e}.col h3,.top h2,.back{color:#fff}.col .empty{color:#e8e8e8}.wrap>.row{color:#f0f0f0}
.lg{height:42px;width:auto;vertical-align:middle;margin-inline-start:10px}
.loginlg{display:block;margin:0 auto 12px;height:130px;width:auto}
.tb{width:100%;border-collapse:collapse}.tb th,.tb td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
/* ===== توافق الجوال (آيفون وأندرويد) ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
input,select,textarea{font-size:16px;-webkit-appearance:none;appearance:none}
input[type=checkbox],input[type=radio]{-webkit-appearance:auto;appearance:auto;width:20px;height:20px;padding:0;accent-color:#4a4a4a;cursor:pointer;flex:none}
select{background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);background-position:16px 50%,22px 50%;background-size:6px 6px;background-repeat:no-repeat;padding-inline-start:36px}
header{padding-top:max(14px,env(safe-area-inset-top));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.btn,.tab,.wa{min-height:44px;touch-action:manipulation}.sm{min-height:38px;touch-action:manipulation}
.modal{padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.modal .box{max-height:90vh;max-height:90dvh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.tabs{-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.item img,.item video{max-width:100%}
@media(max-width:600px){.wrap{padding:14px}.banner{height:200px}.img{height:150px}.top h2{font-size:19px}.det{grid-template-columns:repeat(2,1fr)}header h1{font-size:17px}.modal .box{padding:16px}}
.pwb{position:relative}.pwb input{padding-left:46px}
.eye{position:absolute;left:4px;top:4px;bottom:10px;width:40px;background:none;border:0;padding:0;cursor:pointer;color:#6f7377;display:flex;align-items:center;justify-content:center}
.eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>

<body>
<div id="app"><div class="note">جاري التحميل...</div></div>
<script>
/* ===== الإعدادات (غيّرها لمشروع Supabase الخاص بصديقك) ===== */
/* "تذكّرني": إن لم يُفعَّل، تُحذف الجلسة عند إغلاق المتصفح */
(function(){try{if(localStorage.getItem("sb_temp")==="1"&&!sessionStorage.getItem("sb_alive")){Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k));localStorage.removeItem("sb_temp")}}catch(e){}})();
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.5 6.9C3.7 8.6 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function togglePw(b){const i=b.previousElementSibling,s=i.type==="password";i.type=s?"text":"password";b.innerHTML=s?EYEOFF:EYE;b.setAttribute("aria-label",s?"إخفاء كلمة المرور":"إظهار كلمة المرور")}
const DEFAULT_ABOUT=`منذ عام ٢٠١٨، بدأت رحلتي في عالم التصميم الداخلي لصناعة مساحات تحمل روح أصحابها، وتجمع بين الجمال والراحة في كل التفاصيل.

أنا ميعاد أحمد ، أؤمن أن التصميم الناجح لا يقتصر على جمال المكان، بل يحوّله إلى تجربة تشبهك وتعكس أسلوب حياتك. أرافقك من الفكرة الأولى حتى اكتمال التفاصيل، لأصنع لك مساحة تنبض بالأناقة، وتبقى قريبة منك كل يوم.`;
const SBU="https://nhtrghkgmxysesdoysix.supabase.co",SBK="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5odHJnaGtnbXh5c2VzZG95c2l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5OTYzMTcsImV4cCI6MjEwNzU3MjMxN30.Y3Shg8quSz-kXjfQh4fbluWO7rRBJmgjr5IuwQIWgCM";
const UD="app.example.com";   // نطاق داخلي لاسم المستخدم، لازم يطابق ما تكتبه عند إنشاء المدير
const sb=supabase.createClient(SBU,SBK);
const sb2=supabase.createClient(SBU,SBK,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const ROLES={admin:"مدير الشركة",employee:"موظف",engineer:"مهندس",client:"عميل"};
/* المسمى الوظيفي → الصلاحية: «خدمة عملاء» يتواصل مع العميل ويتحكم بإظهار التقارير، والبقية صلاحية الفريق الفني */
const JOBS={"مهندس":"engineer","مقاول":"engineer","مسوّق":"engineer","خدمة عملاء":"employee","مصوّر":"engineer","مصمم":"engineer","عميل":"client"};
const jobOf=m=>m?.job||ROLES[m?.role]||"";
const ST={plan:["التصميم","s-plan"],run:["قيد التنفيذ","s-run"],done:["تم التسليم","s-done"]};
/* see = من يشاهد ، add = من يضيف ، الحذف للمدير فقط */
const TABS=[
{k:"updates",n:"التحديثات والصور",see:"admin,employee,engineer,client",add:"admin,employee,engineer",ph:"اكتب تحديثاً عن سير العمل...",file:"image/*,video/*",multi:1},
{k:"reports",n:"التقارير والملفات",see:"admin,employee,engineer,client",add:"admin,employee,engineer",ph:"عنوان التقرير وملخصه...",file:"*/*"},
{k:"messages",n:"المراسلات",see:"admin,employee,client",add:"admin,employee,client",ph:"اكتب رسالة..."},
{k:"internal",n:"ملاحظات داخلية",see:"admin,employee,engineer",add:"admin,employee,engineer",ph:"ملاحظة داخلية (لا يراها العميل)..."}];
let S={user:null,role:"none",name:"",job:"",staff:{},projects:[],members:[],cur:null,tab:"updates",entries:[],urls:{},modal:null,cred:null,solo:false};
const has=(l,r=S.role)=>l.split(",").includes(r);
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(100,parseInt(v)||0));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>v==null||v===""?"-":Number(v).toLocaleString("en-US");
const adm=()=>S.role==="admin",canEdit=()=>["admin","employee","engineer"].includes(S.role);
const firstTab=()=>TABS.find(t=>has(t.see)).k;
function timing(p){
  if(p.status==="done"||!p.due)return null;
  const d=Math.round((new Date(p.due+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5);
  return d<0?{late:1,t:`متأخر ${-d} يوم`}:{late:0,t:d===0?"التسليم اليوم":`على الموعد · باقي ${d} يوم`};
}
const chip=p=>{const t=timing(p);return t?`<div class="cw"><span class="chip ${t.late?"late":"ok"}">${t.t}</span></div>`:""};

/* ===== الدخول ===== */
async function init(){
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user||null;S.user?boot():loginView();
}
function loginView(msg=""){
  $("app").innerHTML=`<div class="login box"><a href="index.html" title="الرئيسية" style="display:block;text-align:center;line-height:0"><img class="loginlg" src="logo.png" alt="بيوت"></a><h2 style="text-align:center">تسجيل الدخول</h2>
  <input id="em" placeholder="اسم المستخدم أو البريد الإلكتروني" autocapitalize="none" dir="ltr">
  <div class="pwb"><input id="pw" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')signIn()"><button type="button" class="eye" aria-label="إظهار كلمة المرور" onclick="togglePw(this)"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <div class="msg">${msg}</div><button class="btn" onclick="signIn()">دخول</button><p style="text-align:center"><a href="index.html">← الرئيسية</a></p></div>`;
}
async function signIn(){
  let em=$("em").value.trim();if(!em.includes("@"))em=em.toLowerCase()+"@"+UD;
  const {data,error}=await sb.auth.signInWithPassword({email:em,password:$("pw").value});
  if(error)return loginView("اسم المستخدم أو كلمة المرور غير صحيحة");
  S.user=data.user;boot();
}
async function out(){
  try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();if(s)await sb.from("push_subscriptions").delete().eq("endpoint",s.endpoint)}catch(e){}
  await sb.auth.signOut();location.reload()
}
async function boot(){
  const {data:p}=await sb.from("profiles").select("role,name,job").eq("id",S.user.id).maybeSingle();
  S.role=p?.role||"none";S.name=p?.name||"";S.job=p?.job||"";
  if(adm())await Promise.all([loadMembers(),loadStaff(),loadWs(),cntReq()]);
  await loadAbout();await initPush();await load();
  if(!S.rt)startLive();
  const h=location.hash.slice(1);
  if(h==="about"||(h==="book"&&S.role==="client"))nav(h);
}
async function loadMembers(){
  const {data}=await sb.from("profiles").select("*").in("role",["employee","engineer","client"]).order("created_at");
  S.members=data||[];
}

async function loadStaff(){
  const {data}=await sb.from("project_staff").select("*");
  S.staff={};(data||[]).forEach(r=>{(S.staff[r.project_id]=S.staff[r.project_id]||[]).push(r.user_id)});
}

/* ===== البيانات ===== */
async function load(){
  const {data,error}=await sb.from("projects").select("*").order("created_at",{ascending:false});
  if(error)alert("تعذر تحميل المشاريع: "+error.message);
  S.projects=data||[];
  S.solo=!adm()&&S.projects.length===1;   // العميل/الموظف عنده مشروع واحد: يفتح مباشرة
  await sign(S.projects.map(p=>p.cover_path));
  if(S.solo){S.cur=S.projects[0].id;if(!has(TABS.find(t=>t.k===S.tab).see))S.tab=firstTab();await loadE()}
  render();
}
async function sign(paths,bk="media"){
  const need=[...new Set(paths.filter(x=>x&&!S.urls[x]))];if(!need.length)return;
  const {data}=await sb.storage.from(bk).createSignedUrls(need,7200);
  (data||[]).forEach(d=>{if(d.signedUrl)S.urls[d.path]=d.signedUrl});
  if(bk!=="media"||S.thOk===false)return;
  const imgs=need.filter(x=>/\.(jpe?g|png|webp)$/i.test(x));
  await Promise.all(imgs.map(async x=>{try{const {data:t}=await sb.storage.from(bk).createSignedUrl(x,7200,{transform:{width:800,quality:70}});if(t?.signedUrl)S.th[x]=t.signedUrl}catch(e){}}));
  if(S.thOk===undefined&&imgs.length&&S.th[imgs[0]]){S.thOk=await fetch(S.th[imgs[0]],{method:"HEAD"}).then(r=>r.ok).catch(()=>false);if(!S.thOk)S.th={}}
}
const tu=x=>S.thOk?S.th[x]:null,cu=p=>tu(p.cover_path)||S.urls[p.cover_path];
const MAXB=5*1024*1048576;
function tusUp(bk,path,f,onp){
  return new Promise(async(res,rej)=>{
    const {data}=await sb.auth.getSession();
    const u=new tus.Upload(f,{endpoint:SBU.replace(".supabase.co",".storage.supabase.co")+"/storage/v1/upload/resumable",
      retryDelays:[0,2000,5000,10000,20000],headers:{authorization:"Bearer "+data.session.access_token,"x-upsert":"false"},
      uploadDataDuringCreation:true,removeFingerprintOnSuccess:true,chunkSize:6*1048576,
      metadata:{bucketName:bk,objectName:path,contentType:f.type||"application/octet-stream",cacheControl:"3600"},
      onProgress:(a,b)=>onp&&onp(Math.round(a/b*100)),onError:rej,onSuccess:()=>res()});
    u.findPreviousUploads().then(pr=>{if(pr.length)u.resumeFromPreviousUpload(pr[0]);u.start()});
  });
}
async function up(pid,f,onp){
  if(f.size>MAXB){alert(`حجم الملف ${(f.size/1048576).toFixed(0)}MB أكبر من الحد المسموح (5GB).`);return null}
  const ext=(f.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"")||"bin",net=/load failed|network|fetch|timeout/i;
  let path,error;
  for(let i=0;i<3;i++){
    path=`${pid}/${crypto.randomUUID()}.${ext}`;
    try{
      if(f.size>6*1048576)await tusUp("media",path,f,onp);
      else{const r=await sb.storage.from("media").upload(path,f,{contentType:f.type||"application/octet-stream"});if(r.error)throw r.error}
      error=null;break;
    }catch(e){error=e;if(!net.test(e.message||String(e)))break;await new Promise(r=>setTimeout(r,1500))}
  }
  if(error){const m=error.message||String(error);alert("فشل الرفع: "+m+(/413|exceed|too large/i.test(m)?"\nحجم الملف أكبر من الحد المضبوط في Supabase. ارفع الحد من Storage ← Settings.":net.test(m)?"\nانقطع الاتصال أثناء الرفع. جرّب على Wi-Fi ثم أعد المحاولة.":""));return null}
  return path;
}
async function loadE(){
  const {data}=await sb.from("entries").select("*").eq("project_id",S.cur).eq("kind",S.tab).order("created_at",{ascending:false});
  S.entries=data||[];await sign(S.entries.map(e=>e.file_path));
}

/* ===== العرض ===== */
function render(){

  if(adm()){
    const ids=[...document.querySelectorAll("#mstaff input:checked")].map(x=>x.value),c=$("mcl").value,nm=id=>S.members.find(m=>m.id===id)?.name||null;
    staffIds=ids;

async function delProj(){

async function resizeImg(file,max,type){
  const bmp=await createImageBitmap(file),k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);
  const x=cv.getContext("2d");if(type==="image/jpeg"){x.fillStyle="#707070";x.fillRect(0,0,cv.width,cv.height)}
  x.drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("resize")),type,.86));
}

function shrink(f,max=1600){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(b=>b?res(b):rej(new Error("تعذر معالجة الصورة")),"image/jpeg",0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("تعذر قراءة الصورة"))};
    img.src=u;
  });
}
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
/* يحوّل ملف PDF إلى نسخة عرض مسطّحة (صور للصفحات بجودة متوسطة) فلا يُرفع الأصل ولا نصوصه */
async function flattenPdf(f,onp){
  await loadLib(PDFJS+"pdf.min.js");await loadLib("jspdf.umd.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  const n=Math.min(pdf.numPages,40);
  if(pdf.numPages>40&&!confirm(`الملف ${pdf.numPages} صفحة، سيُرفع أول 40 صفحة فقط. متابعة؟`))throw new Error("أُلغي الرفع");
  const {jsPDF}=window.jspdf;let doc=null;
  for(let i=1;i<=n;i++){
    onp&&onp(i+"/"+n);
    const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:Math.min(2,1400/v0.width)});
    const c=document.createElement("canvas");c.width=Math.round(v.width);c.height=Math.round(v.height);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:v}).promise;
    const o=v0.width>v0.height?"l":"p";
    if(!doc)doc=new jsPDF({orientation:o,unit:"pt",format:[v0.width,v0.height],compress:true});else doc.addPage([v0.width,v0.height],o);
    doc.addImage(c.toDataURL("image/jpeg",0.8),"JPEG",0,0,v0.width,v0.height);
  }
  return doc.output("blob");
}

    if(S.vapid&&pushOK()&&Notification.permission==="granted"){const reg=await navigator.serviceWorker.ready;S.pushOn=!!(await reg.pushManager.getSubscription())}
  }catch(e){}
}
async function enablePush(){
  if(!pushOK())return alert(/iphone|ipad|ipod/i.test(navigator.userAgent)?"على الآيفون: ثبّت الموقع أولاً من زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية»، وافتحه من الأيقونة وفعّل الإشعارات.":"هذا المتصفح لا يدعم الإشعارات");
  if(await Notification.requestPermission()!=="granted")return alert("لم يتم السماح بالإشعارات. فعّلها من إعدادات المتصفح للموقع.");
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(S.vapid)});
    const j=sub.toJSON();
    const {error}=await sb.from("push_subscriptions").upsert({user_id:S.user.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:"endpoint"});
    if(error)throw error;
    S.pushOn=true;toast("تم تفعيل الإشعارات ✅");render();
  }catch(e){alert("تعذر تفعيل الإشعارات: "+(e.message||e))}
}
/* ===== التقرير الشهري PDF ===== */
const MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const loadLib=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("تعذر تحميل "+src));document.head.appendChild(s)});
function openRep(sc){S.repScope=sc;S.modal="rep";S.cred=null;render()}
function repHtml(){
  const now=new Date(),opts=[];
  for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);opts.push(`<option value="${d.getFullYear()}-${d.getMonth()}">${MN[d.getMonth()]} ${d.getFullYear()}</option>`)}
  const one=S.repScope==="one",p=S.projects.find(x=>x.id===S.cur);
  return `<div class="modal"><div class="box"><h3>التقرير الشهري (PDF)</h3>
  <p class="lbl">${one?"المشروع: "+esc(p?.name):`كل المشاريع قيد التنفيذ (${S.projects.filter(x=>x.status==="run").length}) — يُتخطّى المشروع الذي له تقرير لنفس الشهر`}</p>
  <select id="rm">${opts.join("")}</select>
  <p class="lbl">يُضاف التقرير إلى «التقارير والملفات» ويصل العميل والفريق إشعاراً.</p>
  <button class="btn" id="rb" onclick="runReports()">إنشاء</button> ${mclose}</div></div>`;
}
async function runReports(){
  const [y,m]=$("rm").value.split("-").map(Number),b=$("rb");
  const list=S.repScope==="one"?S.projects.filter(x=>x.id===S.cur):S.projects.filter(x=>x.status==="run");
  if(!list.length)return alert("لا توجد مشاريع");
  b.disabled=true;let ok=0,skip=0;
  try{
    b.textContent="جاري تحميل المكتبات...";
    await loadLib("html2canvas.min.js");await loadLib("jspdf.umd.min.js");
    const title=`التقرير الشهري — ${MN[m]} ${y}`;
    for(let i=0;i<list.length;i++){
      const p=list[i];b.textContent=`جاري إنشاء تقرير ${i+1} من ${list.length}...`;
      if(S.repScope==="all"){const {data}=await sb.from("entries").select("id").eq("project_id",p.id).eq("kind","reports").like("body",title+"%").limit(1);if(data?.length){skip++;continue}}
      const blob=await buildPdf(p,y,m),path=await up(p.id,new File([blob],"report.pdf",{type:"application/pdf"}));
      if(!path)continue;
      const {error}=await sb.from("entries").insert({project_id:p.id,kind:"reports",body:`${title} — ${p.name}`,file_path:path,file_type:"application/pdf",author_name:"التقرير الشهري",client_visible:true});
      if(error){alert(error.message);continue}ok++;
    }
  }catch(e){alert("تعذر إنشاء التقرير: "+(e.message||e))}
  alert(`تم إنشاء ${ok} تقرير`+(skip?` وتخطي ${skip} (موجود مسبقاً)`:""));
  S.modal=null;if(S.cur)await loadE();render();
}
async function buildPdf(p,y,m){
  const st=new Date(y,m,1).toISOString(),en=new Date(y,m+1,1).toISOString();
  const {data}=await sb.from("entries").select("*").eq("project_id",p.id).in("kind",["updates","reports"]).gte("created_at",st).lt("created_at",en).order("created_at");
  const L=data||[],ups=L.filter(x=>x.kind==="updates"),imgs=L.filter(x=>x.file_path&&(x.file_type||"").startsWith("image")).slice(0,6);
  let urls=[];if(imgs.length){const r=await sb.storage.from("media").createSignedUrls(imgs.map(x=>x.file_path),600);urls=(r.data||[]).map(x=>x.signedUrl).filter(Boolean)}
  const t=timing(p),el=document.createElement("div");
  el.style.cssText="position:fixed;left:-9999px;top:0;width:794px;background:#fff;color:#2b2d2f;padding:44px;box-sizing:border-box;direction:rtl;font-family:Tajawal,Tahoma,sans-serif;line-height:1.8";
  const row=(a,v)=>`<tr><td style="padding:6px 10px;border:1px solid #ddd;background:#f4f4f4;width:30%">${a}</td><td style="padding:6px 10px;border:1px solid #ddd">${v}</td></tr>`;
  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #545454;padding-bottom:12px;margin-bottom:18px"><div><div style="font-size:26px;font-weight:700">التقرير الشهري</div><div style="color:#6f7377">${MN[m]} ${y}</div></div><img src="logo.png" style="height:70px"></div>
  <h2 style="margin:0 0 10px">${esc(p.name)}${p.loc?" — "+esc(p.loc):""}</h2>
  <div style="background:#e6e6e6;border-radius:8px;height:16px;overflow:hidden"><div style="width:${clamp(p.progress)}%;height:100%;background:#55595e"></div></div>
  <div style="margin:6px 0 16px">نسبة الإنجاز: <b>${clamp(p.progress)}%</b></div>
  <table style="width:100%;border-collapse:collapse;margin-bottom:18px">${row("الحالة",ST[p.status][0])}${row("فريق العمل",esc(p.employee_name)||"-")}${row("تاريخ البداية",esc(p.start_date)||"-")}${row("تاريخ التسليم",esc(p.due)||"-")}${t?row("الموقف الزمني",t.t):""}</table>
  <h3>أعمال الشهر (${ups.length})</h3>
  ${ups.slice(0,20).map(x=>`<div style="border-bottom:1px solid #e2e2e2;padding:6px 0"><small style="color:#6f7377">${new Date(x.created_at).toLocaleDateString("ar")}</small><div>${esc(x.body)}</div></div>`).join("")||'<div style="color:#6f7377">لا توجد تحديثات مسجلة هذا الشهر.</div>'}
  ${urls.length?`<h3 style="margin-top:18px">صور من الموقع</h3><div style="display:flex;flex-wrap:wrap;gap:8px">${urls.map(u=>`<img crossorigin="anonymous" src="${u}" style="width:236px;height:170px;object-fit:cover;border-radius:6px">`).join("")}</div>`:""}
  <div style="margin-top:24px;color:#6f7377;font-size:13px;border-top:1px solid #ddd;padding-top:8px">أُنشئ بتاريخ ${new Date().toLocaleDateString("ar")} — بيوت</div>`;
  document.body.appendChild(el);
  try{
    await Promise.all([...el.querySelectorAll("img")].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;setTimeout(r,8000)})));
    const cv=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:"#fff"});
    const doc=new window.jspdf.jsPDF("p","pt","a4"),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),ph=Math.floor(cv.width*H/W);
    for(let y0=0,pg=0;y0<cv.height;y0+=ph,pg++){
      const c=document.createElement("canvas");c.width=cv.width;c.height=Math.min(ph,cv.height-y0);
      c.getContext("2d").drawImage(cv,0,y0,cv.width,c.height,0,0,cv.width,c.height);
      if(pg)doc.addPage();doc.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,W,c.height*W/cv.width);
    }
    return doc.output("blob");
  }finally{el.remove()}
}

let DP=null;const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function installBar(msg,btn=""){
  if(standalone||$("ib"))return;
  try{if(localStorage.getItem("ib0"))return}catch(e){}
  const d=document.createElement("div");d.id="ib";
  d.style.cssText="position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;z-index:50;background:#545454;color:#fff;padding:12px 14px;border-radius:14px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 6px 20px #0006";
  d.innerHTML=`<span style="flex:1">${msg}</span>${btn}<button onclick="closeIb()" style="background:none;border:0;color:#fff;font-size:22px;cursor:pointer;min-width:36px">✕</button>`;
  document.body.appendChild(d);
}
function closeIb(){$("ib")?.remove();try{localStorage.setItem("ib0","1")}catch(e){}}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;installBar("ثبّت التطبيق على جوالك","<button class='btn' onclick='DP.prompt();closeIb()'>تثبيت</button>")});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1))
  installBar("للتثبيت: اضغط زر المشاركة ⬆️ ثم «إضافة إلى الشاشة الرئيسية»");
init();
